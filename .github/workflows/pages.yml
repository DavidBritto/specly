# GitHub Pages Deployment Workflow (INERT / DISABLED)
#
# This workflow is prepared for review only and is intentionally inactive.
# Remote deployment, GitHub Pages activation, or repository operations require
# separate explicit authorization naming destination, operation, and credential/session.

name: Deploy Static Site to Pages (Inert)

on:
  workflow_dispatch: # Manual trigger only; inactive by default

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    if: false # Explicitly disabled / inert pending authorization
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
